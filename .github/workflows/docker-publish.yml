name: Docker

on:
  repository_dispatch:
  workflow_dispatch:
  push:

permissions:
  contents: read
  packages: write

env:
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@main

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: crpi-57oouj3y2fpxfp6n.cn-guangzhou.personal.cr.aliyuncs.com
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
        
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push Docker images
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./Dockerfile
        platforms: linux/amd64,linux/arm64
        push: true
        tags: crpi-57oouj3y2fpxfp6n.cn-guangzhou.personal.cr.aliyuncs.com/container-repositories/qq:latest
        provenance: false
        sbom: false
